<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My AWS Static Website</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .container{
      background:white;
      padding:40px;
      border-radius:10px;
      text-align:center;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      width:350px;
    }

    h1{
      color:#232f3e;
      margin-bottom:15px;
    }

    p{
      margin-bottom:20px;
      color:#555;
    }

    button{
      padding:10px 20px;
      border:none;
      background:#ff9900;
      color:white;
      font-size:16px;
      border-radius:5px;
      cursor:pointer;
    }

    button:hover{
      background:#e68a00;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Welcome to AWS</h1>
    <p>This is my static website hosted on AWS S3.</p>

    <button onclick="showMessage()">
      Click Me
    </button>
  </div>

  <script>
    function showMessage(){
      alert("Website Hosted Successfully on AWS!");
    }
  </script>

</body>
</html>
